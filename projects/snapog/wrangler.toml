name = "snapog"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Default env (production). Bindings declared here apply only to the default env,
# NOT to named [env.*] blocks — wrangler does not inherit them. Re-declare per env.

[[d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "87add7bf-87c2-4c01-bade-96ec73043192"

[[r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

[vars]
ENVIRONMENT = "production"
# Set AUTH_SECRET via `wrangler secret put AUTH_SECRET` for dashboard cookie signing

[env.staging]
name = "snapog-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "87add7bf-87c2-4c01-bade-96ec73043192"

[[env.staging.r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "snapog"

[[env.production.d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "87add7bf-87c2-4c01-bade-96ec73043192"

[[env.production.r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

[env.production.vars]
ENVIRONMENT = "production"
